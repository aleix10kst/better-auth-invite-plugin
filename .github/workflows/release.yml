name: Release

# Manually triggered: GitHub → Actions → Release → "Run workflow".
# Everything after the button click is automated.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump (auto = derive from the Conventional Commits since the last tag)
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]

# Never let two releases race for the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit + tag, create the release
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }} # stay on the branch so we can push back
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # npm performs the publish, not `bun publish`: trusted publishing and
      # provenance attestation are npm CLI features.
      #
      # Deliberately no `registry-url`, even though npm's own docs show it.
      # That input makes setup-node write `_authToken=${NODE_AUTH_TOKEN}` into
      # .npmrc unconditionally; with no token secret — the whole point of
      # trusted publishing — it expands to a placeholder, npm decides auth is
      # already configured, never attempts the OIDC exchange, and the publish
      # dies with a bare E404. registry.npmjs.org is the default anyway.
      # See actions/setup-node#1551 and npm/documentation#1960.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >= 11.5.1. Pinned to a major rather
      # than @latest so a new major cannot land unannounced mid-release; 12.x
      # is the line this workflow was verified against.
      - run: npm install -g npm@12
      - run: bun install --frozen-lockfile

      # Fail loudly and early if OIDC is unavailable, rather than letting it
      # surface later as an inscrutable ENEEDAUTH from the publish step.
      - name: Verify OIDC is available
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC token endpoint present; trusted publishing can proceed."
          else
            echo "::error::No OIDC token endpoint - 'id-token: write' is not in effect."
            exit 1
          fi

      # Work out the bump the commits actually justify, so a release cannot
      # quietly ship a breaking change as a patch. `auto` takes it as given;
      # an explicit choice may go higher than required, never lower. Runs
      # before the slow verification steps so a bad selection fails in
      # seconds.
      - name: Resolve bump
        id: resolve
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range="${last_tag:+$last_tag..}HEAD"
          subjects=$(git log --format=%s "$range")
          bodies=$(git log --format=%B "$range")
          current=$(node -p "require('./package.json').version")

          if printf '%s\n' "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:' ||
            printf '%s\n' "$bodies" | grep -qE '^BREAKING[ -]CHANGE:'; then
            reason="a breaking change"
            # 0.x semantics: a breaking change is a minor. Bumping to major
            # here would silently announce "this is stable now".
            if [ "${current%%.*}" = 0 ]; then required=minor; else required=major; fi
          elif printf '%s\n' "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then
            reason="a feat commit"
            required=minor
          else
            reason="only patch-level commits"
            required=patch
          fi

          rank() { case "$1" in patch) echo 0 ;; minor) echo 1 ;; major) echo 2 ;; esac; }
          selected='${{ inputs.bump }}'
          if [ "$selected" = auto ]; then
            resolved="$required"
          elif [ "$(rank "$selected")" -lt "$(rank "$required")" ]; then
            echo "::error::$range contains $reason, so the smallest correct bump is '$required', but '$selected' was selected. Re-run with '$required' or 'auto'."
            exit 1
          else
            resolved="$selected"
          fi

          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
          {
            echo "### Release bump"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| current version | \`$current\` |"
            echo "| commits considered | \`$range\` |"
            echo "| commits justify | **$required** ($reason) |"
            echo "| selected | \`$selected\` |"
            echo "| applying | **$resolved** |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Verify before mutating anything.
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Bump locally only. Nothing reaches the remote until npm has accepted
      # the publish, so a failed publish leaves behind no tag and no release.
      - name: Bump version
        id: bump
        run: |
          version=$(npm version "${{ steps.resolve.outputs.resolved }}" -m 'chore(release): %s')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No NODE_AUTH_TOKEN: auth comes from the OIDC token, and provenance is
      # attached automatically.
      - run: npm publish --loglevel verbose
        env:
          # Must be explicitly empty, not merely unset. setup-node writes
          # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc; unset leaves the
          # literal XXXXX placeholder, which npm accepts as a credential and
          # so never attempts OIDC. Empty reads as "no auth", letting npm fall
          # through to the OIDC exchange, while the .npmrc `registry=` line
          # setup-node also writes stays in place.
          NODE_AUTH_TOKEN: ""

      - name: Dump npm debug log
        if: failure()
        run: tail -n 60 /home/runner/.npm/_logs/*.log || true

      # Only now that npm holds the package is it safe to publish the git side.
      - run: git push --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.version }}" \
            --title "${{ steps.bump.outputs.version }}" \
            --generate-notes
