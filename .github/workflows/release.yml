name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # npm performs the publish, not `bun publish`: trusted publishing and
      # provenance attestation are npm CLI features.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      # No NODE_AUTH_TOKEN: auth comes from the OIDC token, and provenance is
      # attached automatically. `prepublishOnly` runs typecheck + test + build.
      - run: npm publish
